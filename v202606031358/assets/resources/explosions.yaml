# --- Warp-in arrival VFX (procedural canvas, sibling of the explosions above). Spawned by
#     the Phase when an enemy respawns or the player ship is rebuilt. `WarpField` reads the
#     entity's progress 0..1 over `animation.duration`, then autoRemove fires entity:remove.

# Ship warp: full hyperspace exit (converging streaks → flash → expanding shockwave).
- id: warp-in-ship
  type: WarpIn
  size:
    w: 160
    h: 160
  animation:
    duration: 850
    loop: false
    autoRemove: true
  components:
    - type: WarpField
      variant: ship
      size:
        w: 160
        h: 160
      color: '#aef4ff'

# Rock warp: subtle materialisation (soft dust ring + shimmer + twinkling specks).
- id: warp-in-rock
  type: WarpIn
  size:
    w: 96
    h: 96
  animation:
    duration: 800
    loop: false
    autoRemove: true
  components:
    - type: WarpField
      variant: rock
      size:
        w: 96
        h: 96
      color: '#8de3e8'
