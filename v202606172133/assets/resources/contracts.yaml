  repReward: 8

# --- ADR-25 emenda: prerequisite chain (contract A unlocks contract B) ---
# `requires` lists contract ids that must be COMPLETED before this one appears UNLOCKED on the board
# (until then it shows greyed + "REQUER: {título}"). The prereq is "contract X done" — it reuses the
# persisted `completedIds`, no flag store needed. This chain BRANCHES off `first-blood` (two dependents)
# and then continues, so the CADEIAS tree shows a fan-out + a deeper tier:
#   first-blood ─┬─ proving-grounds ── veterans-trial
#               └─ recon-sweep
- id: proving-grounds
  title: Proving Grounds
  client: VANGUARD DISPATCH
  summary: You drew first blood — now hold a lane and thin the raider pack.
  objective:
    kind: kill
    targets:
      - Drone
      - Fighter
    count: 5
  reward:
    credits: 220
    xp: 100
  danger: med
  faction: federation
  repRequired: 0
  repReward: 10
  requires:
    - first-blood

- id: veterans-trial
  title: Veteran's Trial
  client: VANGUARD DISPATCH
  summary: Final proof of the chain — break a full raider wing on your own.
  objective:
    kind: kill
    targets:
      - Drone
      - Fighter
    count: 8
  reward:
    credits: 480
    xp: 200
    resources:
      energy: 10
  danger: high
  faction: federation
  repRequired: 0
  repReward: 14
  requires:
    - proving-grounds

# Branch sibling of `proving-grounds` — also unlocked by `first-blood`, so the chain fans out. Kept
# at a comparable early-game weight to `proving-grounds` (a parallel, not a harder, follow-up).
- id: recon-sweep
  title: Recon Sweep
  client: VANGUARD DISPATCH
  summary: First blood drawn — now sweep the drift and thin the recon drones casing it.
  objective:
    kind: kill
    targets:
      - Drone
    count: 6
  reward:
    credits: 200
    xp: 90
  danger: med
  faction: federation
  repRequired: 0
  repReward: 9
  requires:
    - first-blood

# --- ADR-31: non-kill objectives ---
# Mining: `objective.kind: mine` counts the (untagged, positive) `resource:changed` inflow of
# `resource` while active — ore mined this session (asteroid drops), not pre-existing cargo. The
# ore is NOT consumed (it stays in cargo to sell/deliver). A metal rock drops 3, so 10 ≈ 4 rocks.
- id: prospect-run
  title: Prospect Run
  client: BELT-04 · MINER GUILD
  summary: Crack open metal-bearing rocks and bank the ore for the Guild.
  objective:
    kind: mine
    resource: metal
    count: 10
  reward:
    credits: 120
    xp: 60
  danger: low
  faction: hauler-guild
  repRequired: 0
  repReward: 6

# Delivery: `objective.kind: deliver` consumes `count` of `resource` from cargo when the player
# docks at `destHubId` (matches a hub id in objects.yaml — here Kessen Outpost). Partial
# deliveries accumulate across docks; the ore is debited (handed over), not sold.
- id: supply-kessen
  title: Supply Run · Kessen
  client: KESSEN STATION · LOGISTICS
  summary: Haul refined metal to Kessen Outpost to restock the foundry.
  objective:
    kind: deliver
    resource: metal
    count: 8
    destHubId: colony-kessen
  reward:
    credits: 200
    xp: 80
  danger: low
  faction: federation
  repRequired: 0
  repReward: 7
