- id: first-blood
  title: First Blood
  client: VANGUARD DISPATCH
  summary: A starter bounty — take down a handful of pirates to prove your guns.
  objective:
    kind: kill
    targets:
      - Drone
      - Fighter
    count: 3
  reward:
