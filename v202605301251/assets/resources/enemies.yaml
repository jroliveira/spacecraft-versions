# --- Pirate enemies (GDD §7). detectable: true → radar/minimap show them and the player's
#     droid auto-fires at them. Procedural pixel-art via PirateShip (swap for Sprite later).

# Drone: stationary guard post. Faces the player and fires ranged bolts within aggro range.
- id: pirate-drone
  type: Drone
  detectable: true
  collidable:
    health: 12
    damage: 8
  speed:
    up: 0
  size:
    w: 40
    h: 40
  detonable:
    explosion: explosion-a-1.1
  reward:
    xp: 25
  # aggroRadius kept under the player's radar maxRadius (sensors.yaml: 400) so an engaging
  # drone is always detected — closing the auto-fire / homing loop.
  ai:
    aggroRadius: 360
  fire:
    projectile: pirate-bolt
    cooldown: 1100
  components:
    - type: PirateShip
      variant: drone
      size:
        w: 40
        h: 40
      palette:
        hull: '#7a3b3b'
        accent: '#ff6a4a'
    - type: HealthBar
      outer:
        color: white
        pos:
          x: 0
          y: 10
        size:
          w: 2
          h: 7
      inner:
        color: red
        pos:
          x: 1
          y: 9
        size:
          h: 5

# Fighter: rushes the player within leashRadius of its anchor, returns when the player flees.
# Damage is by contact.
- id: pirate-fighter
  type: Fighter
  detectable: true
  collidable:
    health: 34
    damage: 14
  # speed.up doubles as the fighter's max flight speed (see Fighter.physics).
  speed:
    up: 2.5
    down: 2.5
    left: 2.5
    right: 2.5
  size:
    w: 58
    h: 52
  detonable:
    explosion: explosion-a-1.1
  reward:
    xp: 35
  ai:
    aggroRadius: 380
    leashRadius: 900
  fire:
    projectile: pirate-bolt
    cooldown: 1500
  components:
    - type: PirateShip
      variant: fighter
      size:
        w: 58
        h: 52
      palette:
        hull: '#6e2f2f'
        accent: '#ffb24a'
    - type: HealthBar
      outer:
        color: white
        pos:
          x: 0
          y: 10
        size:
          w: 2
          h: 7
      inner:
        color: red
        pos:
          x: 1
          y: 9
        size:
          h: 5
