- type: Soldier
  collidable:
    health: 50
    damage: 100
  timeNextMove: 250
  width: 48
  height: 48
  sprite:
    row: 0
    col: 0
  pos:
    x: center
    y: bottom
  canvas:
    width: 540
    height: 900
  components:
    - type: Spritesheet
      src: characters/soldier
      rows: 4
      cols: 3
    - type: Minimap
      pos:
        x: right
        y: top
  speed:
    up: 1
    left: 1
    right: 1
    down: 1

- type: Ship
  collidable:
    health: 50
    damage: 100
  timeNextMove: 83
  height: 64.5
  width: 58.4
  sprite:
    row: 2
    col: 1
  pos:
    x: center
    y: bottom
  canvas:
    width: 540
    height: 900
  components:
    - type: Spritesheet
      src: characters/ship
      rows: 3
      cols: 3
    - type: HealthBar
      outer:
        color: white
        pos:
          x: 0
          y: 10
        width: 2
        height: 7
      inner:
        color: red
        pos:
          x: 1
          y: 9
        height: 5
  projectiles:
    first: bullet
    second: missile
  speed:
    up: 2
    left: 2
    right: 2
    down: 2
