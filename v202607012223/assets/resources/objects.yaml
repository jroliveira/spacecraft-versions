# === Jump gate (MVP feature #4 · World backbone) ===
# The travel point: fly within dockRange + press [F] to open the star map (gate:docked → Game). One
# shared config placed via `start` in every sector phase (each scenario load makes its own instance;
# worlds are separate, so the same world coords are fine). Dedicated `GatePortal` art (a ring + glowing
# event horizon · ADR-41) so it reads as a JUMP GATE, distinct from the hub's StationHull. Placed away
# from the hub/spawn so reaching it requires navigating.
- id: jump-gate
  type: JumpGate
  name: Portão de Salto
  pos:
    x: 1600
    y: 2300
  dockRange: 280
  components:
    - type: GatePortal
      size:
        w: 200
        h: 200
      spin: 0.16
      palette:
        ring: '#2e2a4a'
        glow: '#b48dff'

# === Survey beacons (POIs · MVP #6 · explore objective · emenda ADR-31) ===
# Fixed, authored landmarks placed via the Phase `start` method. The Poi entity emits `poi:reached`
# when the ship crosses `reachRadius`; an `explore` contract that targets this `id` advances. Passive
# (no docking/collision). Procedural `SurveyBeacon` art (objective ring + ping + core), swappable for a
# Sprite. Placed away from the spawn/hub/gate so reaching it requires navigating the sector.
- id: poi-survey-alpha
  type: Poi
  name: Baliza de Survey Alfa
  pos:
    x: 900
    y: 700
  reachRadius: 220
  components:
    - type: SurveyBeacon
      size:
        w: 120
        h: 120
      palette:
        ring: '#5ee7c4'
        glow: '#8de3e8'
      pulseSpeed: 0.8

