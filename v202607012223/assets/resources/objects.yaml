- id: starbase
  type: Starbase
  collidable:
    health: 999
    damage: 0
  pos:
    x: center
    y: top
  components:
    - type: Sprite
      src: objects/starbase
      size:
        w: 250
        h: 250

- id: colony-kessen
  type: Hub
  subtype: colony
  # NDD canon (ADR-43): the Federation hub is Halberd-Central. The entity id stays `colony-kessen`
  # (internal; referenced by contracts/encounters hubId) — only the display name changes.
  name: Estação Halberd-Central
  # Owning faction (ADR-29): drives the reputation price modifier at this hub's market. Must
  # match a `factions.yaml` id. Kessen is a Federation outpost.
  faction: federation
  # ADR-48 A/B experiment: also opens the holographic top-down SCHEMATIC dock root (recolored ciano
  # for the Federation via --fac) so the A/B can be compared across all 3 faction palettes.
  dockUi: schematic
  # Fixed authored landmark in the 1st world (5760x3240, spawn at center 2880,1620): a short
  # flight east-northeast of spawn — easy to find, far enough to require navigating.
  pos:
    x: 4100
    y: 1100
  # Center-to-center proximity (world px) within which docking becomes available. Comfortably
  # larger than the hull half-extent so the prompt appears before the ship reaches the wall.
  dockRange: 260
  # Services offered when docked (ADR-27 + ADR-48 camada 3): the Station Directory gates facades by
  # these — the Bulletin Board, the 3 Market shops (Comércio/Oficina/Entreposto) + the skill-check
  # Terminal (ADR-38).
  services:
    - bulletin-board
    - commerce
    - workshop
    - warehouse
    - terminal
  # Not part of the collision system: "solid" is handled by the piloting deceleration around the
  # hull (Phase.obstacles → MovableBehavior), so the ship is slowed, not repelled.
  components:
    - type: StationHull
      size:
        w: 240
        h: 240
      spin: 0.08
      palette:
        hull: '#3a4a63'
        accent: '#8de3e8'

# === Faction hubs (MVP feature #4 · World backbone, Plano A) ===
# Placeholder docking hubs for the two new sectors, faction-tagged so the market prices by reputation
# (ADR-29) and the board filters by faction (ADR-28) — they ALREADY differ from Kessen. Dedicated
# per-hub content (own contracts/encounters) is Plano B. Positions are world coords inside each
# sector's own phase world (phases.yaml). Palette tints the hull per faction identity.
- id: hub-pioneers
  type: Hub
  subtype: colony
  name: Colônia Verdejo
  faction: pioneers
  # ADR-48 A/B experiment: this hub opens the holographic top-down SCHEMATIC dock root
  # (station-schematic-modal) instead of the iso Station Directory. The other hubs keep `directory`.
  dockUi: schematic
  pos:
    x: 4100
    y: 1100
  dockRange: 260
  services:
    - bulletin-board
    - commerce
    - workshop
    - warehouse
    - terminal
  components:
    - type: StationHull
      size:
        w: 240
        h: 240
      spin: 0.07
      palette:
        hull: '#4a3f2e'
        accent: '#e8c98d'

