# --- Pirate enemies (GDD §7). detectable: true → radar/minimap show them and the player's
#     droid auto-fires at them. Procedural pixel-art via PirateShip (swap for Sprite later).

# Drone: stationary guard post. Faces the player and fires ranged bolts within aggro range.
- id: pirate-drone
  type: Drone
  detectable: true
  collidable:
    health: 12
    damage: 8
  speed:
    up: 0
  size:
    w: 40
    h: 40
  detonable:
    explosion: explosion-a-2
  reward:
    xp: 25
    credits: 15
  # Timed respawn at the guard post; full ship warp-in VFX on arrival.
  respawn:
    delay: 8000
    warp: warp-in-ship
  # aggroRadius kept under the player's radar maxRadius (sensors.yaml: 400) so an engaging
  # drone is always detected — closing the auto-fire / homing loop.
  ai:
    aggroRadius: 360
  fire:
    projectile: pirate-bolt
    cooldown: 1100
