# === Escort ally (MVP #6 · 2ª metade · ADR-44) ===
# A FRIENDLY convoy ship the player protects. Pre-placed dormant via the `patrol` phase method (one
# authored route to a destination); it starts travelling when the matching escort contract is accepted
# (escort:activate) and emits escort:arrived on reaching the final waypoint. Hostiles aim at the nearest
# of {player, ally}, but it takes damage ONLY from enemy fire — no friendly fire (damage: 0 so it never
# hurts the player either). No `reward` (it's not a kill). If destroyed → the escort contract FAILS
# (entity:destroyed); the convoy then RESPAWNS (timed · ADR-21) back at its route start, DORMANT, so the
# escort is retryable in-place — re-accepting the contract re-activates the waiting convoy (the route is
# preserved via RespawnItem.route, the ctor's escort:state:request resumes it if active). Procedural
# PirateShip recoloured friendly cyan-white + a floating HealthBar so the player can watch its hull.
# detectable: false — the ally must be INVISIBLE to the player's own radar/droid/seeker, or the droid
# auto-cannon + homing seeker would target the friendly convoy (radar:detected drives both). Enemies
# still aim at it via the escort target (not radar), and the minimap shows it via entity:added (not
# radar), so it stays a friendly blip + enemy bolts still hit it — only player auto-targeting is spared.
- id: convoy-fed
  type: Escortee
  detectable: false
  collidable:
    health: 70
    damage: 0
  # speed.up doubles as the convoy's max flight speed (Escortee.physics) — a laden, unhurried transport,
  # well under the player ship's 3.5 so escorting is a deliberate shepherding pace (it also paces to the
  # player via FOLLOW_RANGE, so it never outruns its escort).
  speed:
    up: 1.3
    down: 1.3
    left: 1.3
    right: 1.3
  # Timed respawn at the route start (ADR-21) so a failed escort can be retried in-place: the convoy
  # warps back in DORMANT (the contract is already failed → escort:state:request gets no activate); a
  # re-accept then wakes the waiting convoy. Short delay so it's back before the player re-docks.
  respawn:
    delay: 4000
    warp: warp-in-ship
  size:
    w: 60
    h: 54
  detonable:
    explosion: explosion-a-2
  components:
    - type: PirateShip
      variant: fighter
      # Faction hull SHAPE so the convoy reads as a Federation transport; teal livery (below)
      # still flags it FRIENDLY — shape says faction, colour says ally.
      silhouette: federation
      size:
        w: 60
        h: 54
      # Friendly livery: teal hull + bright cyan-white accent, clearly NOT a faction/pirate colour.
      palette:
        hull: '#2f5d57'
        accent: '#9ff5e4'
    - type: HealthBar
      outer:
        color: white
        pos:
          x: 0
          y: 10
        size:
          w: 2
          h: 7
      inner:
        color: '#5ee7c4'
        pos:
          x: 1
          y: 9
        size:
          h: 5

