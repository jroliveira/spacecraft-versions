      variant: drone
      size:
        w: 40
        h: 40
      # Ambient pirate = unaligned scavenger (ADR-43 · QA 2026-06-20): cold steel GRAY — a true neutral,
      # distinct from the faction colours (the old rust read too close to the Pioneiros amber).
      palette:
