# --- ADR-25 emenda: prerequisite chain (contract A unlocks contract B) ---
# `requires` lists contract ids that must be COMPLETED before this one appears UNLOCKED on the board
# (until then it shows greyed + "REQUER: {título}"). The prereq is "contract X done" — it reuses the
# persisted `completedIds`, no flag store needed. This chain BRANCHES off `first-blood` (two dependents)
# and then continues, so the CADEIAS tree shows a fan-out + a deeper tier:
#   first-blood ─┬─ proving-grounds ── veterans-trial
#               └─ recon-sweep
# The whole chain is posted at Halberd-Central (colony-kessen), so the Federation hub's CADEIAS tab shows it.
- id: first-blood
  title: Primeiro Sangue
  client: DESPACHO VANGUARDA
  summary: Contrato de entrada, pagamento tabelado. Abata três hostis e registre. Não precisamos do seu nome — só do número do abate.
  objective:
    kind: kill
    targets:
      - Drone
      - Fighter
    count: 3
  reward:
    credits: 90
    xp: 40
  danger: low
  faction: federation
  repRequired: 0
  repReward: 8
  hubId: colony-kessen

- id: proving-grounds
  title: Campo de Provas
  client: DESPACHO VANGUARDA
  summary: Tirou o primeiro sangue. Agora segure uma rota e rareie a matilha — cinco baixas. A Federação anota quem entrega; é só isso que ela anota.
  objective:
    kind: kill
    targets:
      - Drone
      - Fighter
    count: 5
  reward:
    credits: 220
    xp: 100
  danger: med
  faction: federation
  repRequired: 0
  repReward: 10
  requires:
    - first-blood
  hubId: colony-kessen

- id: veterans-trial
  title: Prova do Veterano
  client: DESPACHO VANGUARDA
  summary: Última prova da série — quebre uma ala inteira sozinho. Oito baixas. Passou, seu número sobe uma faixa no sistema. É o que a Federação chama de reconhecimento.
  objective:
    kind: kill
    targets:
      - Drone
      - Fighter
    count: 8
  reward:
    credits: 480
    xp: 200
    resources:
      energy: 10
  danger: high
  faction: federation
  repRequired: 0
  repReward: 14
  requires:
    - proving-grounds
  hubId: colony-kessen

