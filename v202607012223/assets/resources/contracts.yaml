# === Pioneiros · Colônia Verdejo (hub-pioneers · pioneers) ===
# The Guild posts logistics + extraction work: clearing drones off extraction sites, banking ore,
# and hauling power cells to its own dock. Moved here from Kessen (these were always pioneers ·
# Plano B relocates them to the Pioneers hub) + one new delivery contract for identity.
- id: drone-sweep
  title: Varredura de Drones
  client: COLÔNIA VERDEJO · GUILDA
  summary: Uns drones ficaram rondando nossos sítios e o pessoal tá nervoso de sair pra lavra. Derruba eles pra gente? A gente agradece — e a gente lembra.
  objective:
    kind: kill
    targets:
      - Drone
    count: 5
  reward:
    credits: 160
    xp: 70
  danger: low
  faction: pioneers
  repRequired: 0
  repReward: 5
  hubId: hub-pioneers

# Mining: `objective.kind: mine` counts the (untagged, positive) `resource:changed` inflow of
# `resource` while active — ore mined this session (asteroid drops), not pre-existing cargo. The
# ore is NOT consumed (it stays in cargo to sell/deliver). A metal rock drops 3, so 10 ≈ 4 rocks.
- id: prospect-run
  title: Garimpo
  client: GUILDA PIONEIRA · LOGÍSTICA
  summary: As rochas com metal tão ali de graça, só falta braço. Quebra umas e deposita com a gente — a Guilda divide direitinho. Ajuda hoje, ajuda amanhã.
  objective:
    kind: mine
    resource: metal
    count: 10
  reward:
    credits: 120
    xp: 60
  danger: low
  faction: pioneers
  repRequired: 0
  repReward: 6
  hubId: hub-pioneers

