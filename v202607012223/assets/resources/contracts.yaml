# Contract templates (seed). Loaded into the `contracts` store by setup() each boot.
# The mutable progress/status lives in the separate `contract-save` store.
#
# ADR-24 (foundation) + ADR-25 (bulletin board): a POOL of hunt contracts. None is
# auto-accepted — the player opens the Bulletin Board (docking at a hub · ADR-26) and
# accepts contracts, which are added to the active slots. Completing one removes it from
# the board for good (the `contract-save.completedIds` latch) and never re-pays.
#
# `objective.kind: kill` counts `entity:destroyed` whose entity `type` is in `targets`
# (asteroids/projectiles/the player ship also fire that event — only these types count).
# `reward` is a bonus on top of the per-kill bounty the pirates already grant.
#
# ADR-28 (reputation): `faction` is the client faction id (factions.yaml); completing credits
# `repReward` to it; the board gates the contract until reputation ≥ `repRequired`. A contract
# with no faction/repRequired is ungated and grants no reputation.
#
# ADR-41 emenda (Plano B · hub-dedicated content): `hubId` anchors the contract to a hub's Bulletin
# Board (matches a `HubConfig.id` in objects.yaml), mirroring `EncounterSpec.hubId`. The board lists
# only the DOCKED hub's contracts — each faction hub shows its OWN offers instead of the global pool.
# A contract with no `hubId` is posted at every hub. The Quest Log + tracked widget stay global.
#
# Flavor-pass (2026-07-01 · Códice de Setores): title/client/summary re-voiced so each contract carries
# its sector's "sentir" (docs/game-design/codice-de-setores.md) — Halberd/Fed = cold & procedural
# ("you're replaceable"), Hesper/Pioneers = warm neighbourly ("we remember"), Kessen/Syndicate =
# uncomfortable complicity ("acolhe e cobra"). Only player-facing prose changed; mechanics untouched.
# NB: the Federation hubId `colony-kessen` is a LEGACY internal id (from the original `1st`/Kessen
# scenario, reused as the Halberd sector) — the player never sees it; the Fed client strings are now
# correctly HALBERD-CENTRAL (renaming the entity id is out of scope · minor tech debt).

