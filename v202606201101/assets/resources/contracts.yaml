# --- ADR-25 emenda: prerequisite chain (contract A unlocks contract B) ---
# `requires` lists contract ids that must be COMPLETED before this one appears UNLOCKED on the board
# (until then it shows greyed + "REQUER: {título}"). The prereq is "contract X done" — it reuses the
# persisted `completedIds`, no flag store needed. This chain BRANCHES off `first-blood` (two dependents)
# and then continues, so the CADEIAS tree shows a fan-out + a deeper tier:
#   first-blood ─┬─ proving-grounds ── veterans-trial
#               └─ recon-sweep
# The whole chain is posted at Kessen (colony-kessen), so the Federation hub's CADEIAS tab shows it.
- id: first-blood
  title: First Blood
  client: VANGUARD DISPATCH
  summary: A starter bounty — take down a handful of pirates to prove your guns.
  objective:
    kind: kill
    targets:
      - Drone
      - Fighter
    count: 3
  reward:
    credits: 90
    xp: 40
  danger: low
  faction: federation
  repRequired: 0
  repReward: 8
  hubId: colony-kessen

- id: proving-grounds
  title: Proving Grounds
  client: VANGUARD DISPATCH
  summary: You drew first blood — now hold a lane and thin the raider pack.
  objective:
    kind: kill
    targets:
      - Drone
      - Fighter
    count: 5
  reward:
    credits: 220
    xp: 100
  danger: med
  faction: federation
  repRequired: 0
  repReward: 10
  requires:
    - first-blood
  hubId: colony-kessen

- id: veterans-trial
  title: Veteran's Trial
  client: VANGUARD DISPATCH
  summary: Final proof of the chain — break a full raider wing on your own.
  objective:
    kind: kill
    targets:
      - Drone
      - Fighter
    count: 8
  reward:
    credits: 480
    xp: 200
    resources:
      energy: 10
  danger: high
  faction: federation
  repRequired: 0
  repReward: 14
  requires:
    - proving-grounds
  hubId: colony-kessen

# Branch sibling of `proving-grounds` — also unlocked by `first-blood`, so the chain fans out. Kept
# at a comparable early-game weight to `proving-grounds` (a parallel, not a harder, follow-up).
- id: recon-sweep
  title: Recon Sweep
  client: VANGUARD DISPATCH
  summary: First blood drawn — now sweep the drift and thin the recon drones casing it.
  objective:
    kind: kill
    targets:
      - Drone
    count: 6
  reward:
    credits: 200
    xp: 90
  danger: med
  faction: federation
  repRequired: 0
  repReward: 9
  requires:
    - first-blood
  hubId: colony-kessen

# === Pioneiros · Entreposto Pioneiro (hub-pioneers · hauler-guild) ===
# The Guild posts logistics + extraction work: clearing drones off extraction sites, banking ore,
# and hauling power cells to its own dock. Moved here from Kessen (these were always hauler-guild ·
# Plano B relocates them to the Pioneers hub) + one new delivery contract for identity.
- id: drone-sweep
  title: Drone Sweep
  client: BELT-04 · MINER GUILD
  summary: Knock out the recon drones casing our extraction sites.
  objective:
    kind: kill
    targets:
      - Drone
    count: 5
  reward:
    credits: 160
    xp: 70
  danger: low
  faction: hauler-guild
  repRequired: 0
  repReward: 5
  hubId: hub-pioneers

# Mining: `objective.kind: mine` counts the (untagged, positive) `resource:changed` inflow of
# `resource` while active — ore mined this session (asteroid drops), not pre-existing cargo. The
# ore is NOT consumed (it stays in cargo to sell/deliver). A metal rock drops 3, so 10 ≈ 4 rocks.
- id: prospect-run
  title: Prospect Run
  client: PIONEER GUILD · LOGISTICS
  summary: Crack open metal-bearing rocks and bank the ore for the Guild.
  objective:
    kind: mine
    resource: metal
    count: 10
  reward:
    credits: 120
    xp: 60
  danger: low
  faction: hauler-guild
  repRequired: 0
  repReward: 6
  hubId: hub-pioneers

# New (Plano B): a delivery to the Pioneers' own dock — power cells for the convoy line. Delivery
# consumes `count` energy from cargo when docking at `destHubId` (here the Pioneers hub itself).
- id: power-the-line
  title: Power the Line
  client: PIONEER GUILD · DISPATCH
  summary: Haul charged power cells to the Entreposto to keep the convoy line moving.
  objective:
    kind: deliver
    resource: energy
    count: 6
    destHubId: hub-pioneers
  reward:
    credits: 260
    xp: 110
  danger: med
  faction: hauler-guild
  repRequired: 5
  repReward: 9
  hubId: hub-pioneers

# === Sindicato · Doca do Sindicato (hub-syndicate · syndicate) ===
# The Syndicate posts grey work: thinning rival craft, skimming high-value crystal, and running
# contraband to its own dock. New in Plano B (the Syndicate had no contracts before). Entry jobs are
# ungated (repRequired 0 — a fresh pilot may start with negative Syndicate rep, and repRequired ≤ 0
# is always available); the deeper one gates on Syndicate standing.
- id: thin-the-herd
  title: Thin the Herd
  client: SYNDICATE · ENFORCEMENT
  summary: Clear the freelance craft poaching on Syndicate turf. No questions asked.
  objective:
    kind: kill
    targets:
      - Drone
      - Fighter
    count: 6
  reward:
    credits: 240
    xp: 110
  danger: med
  faction: syndicate
  repRequired: 0
  repReward: 8
  hubId: hub-syndicate

# Mining crystal — the rarest ore (a crystal rock drops 1, priced highest), so a small count is a
# real haul. The Syndicate launders it through the Veil.
- id: crystal-skim
  title: Crystal Skim
  client: SYNDICATE · ACQUISITIONS
  summary: Skim crystal off the drift rocks before the Guild logs it. Bring it quiet.
  objective:
    kind: mine
    resource: crystal
    count: 5
  reward:
    credits: 300
    xp: 120
  danger: med
  faction: syndicate
  repRequired: 0
  repReward: 9
  hubId: hub-syndicate

# Contraband delivery to the Syndicate's own dock — gated on standing (they don't hand the good runs
# to strangers). Higher reward + reputation than the entry jobs.
- id: black-market-run
  title: Black Market Run
  client: SYNDICATE · THE VEIL
  summary: Move a crate of grey-market crystal to the Doca without tripping a manifest.
  objective:
    kind: deliver
    resource: crystal
    count: 4
    destHubId: hub-syndicate
  reward:
    credits: 520
    xp: 200
    resources:
      energy: 10
  danger: high
  faction: syndicate
  repRequired: 12
  repReward: 14
  hubId: hub-syndicate
