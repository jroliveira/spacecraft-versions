- id: starbase
  type: Starbase
  collidable:
    health: 999
    damage: 0
  pos:
    x: center
    y: top
  components:
    - type: Sprite
      src: objects/starbase
      size:
        w: 250
        h: 250

- id: colony-kessen
  type: Hub
  subtype: colony
  name: Kessen Outpost
  # Owning faction (ADR-29): drives the reputation price modifier at this hub's market. Must
  # match a `factions.yaml` id. Kessen is a Federation outpost.
  faction: federation
  # Fixed authored landmark in the 1st world (5760x3240, spawn at center 2880,1620): a short
  # flight east-northeast of spawn — easy to find, far enough to require navigating.
  pos:
    x: 4100
    y: 1100
  # Center-to-center proximity (world px) within which docking becomes available. Comfortably
  # larger than the hull half-extent so the prompt appears before the ship reaches the wall.
  dockRange: 260
  # Services offered when docked (ADR-27): the Hub Menu lists these (Bulletin Board + Market +
  # Terminal · ADR-38, the skill-check Terminal).
  services:
    - bulletin-board
    - market
    - terminal
  # Not part of the collision system: "solid" is handled by the piloting deceleration around the
  # hull (Phase.obstacles → MovableBehavior), so the ship is slowed, not repelled.
  components:
    - type: StationHull
      size:
        w: 240
        h: 240
      spin: 0.08
      palette:
        hull: '#3a4a63'
        accent: '#8de3e8'

# === Faction hubs (MVP feature #4 · World backbone, Plano A) ===
# Placeholder docking hubs for the two new sectors, faction-tagged so the market prices by reputation
# (ADR-29) and the board filters by faction (ADR-28) — they ALREADY differ from Kessen. Dedicated
# per-hub content (own contracts/encounters) is Plano B. Positions are world coords inside each
# sector's own phase world (phases.yaml). Palette tints the hull per faction identity.
- id: hub-pioneers
  type: Hub
  subtype: colony
  name: Entreposto Pioneiro
  faction: hauler-guild
  pos:
    x: 4100
    y: 1100
  dockRange: 260
  services:
    - bulletin-board
    - market
    - terminal
  components:
    - type: StationHull
      size:
        w: 240
        h: 240
      spin: 0.07
      palette:
        hull: '#4a3f2e'
        accent: '#e8c98d'

- id: hub-syndicate
  type: Hub
  subtype: station
  name: Doca do Sindicato
  faction: syndicate
  pos:
    x: 4100
    y: 1100
  dockRange: 260
  services:
    - bulletin-board
    - market
    - terminal
  components:
    - type: StationHull
      size:
        w: 240
        h: 240
      spin: 0.09
      palette:
        hull: '#4a2e3f'
        accent: '#e88dc9'

# === Jump gate (MVP feature #4 · World backbone) ===
# The travel point: fly within dockRange + press [F] to open the star map (gate:docked → Game). One
# shared config placed via `start` in every sector phase (each scenario load makes its own instance;
# worlds are separate, so the same world coords are fine). Dedicated `GatePortal` art (a ring + glowing
# event horizon · ADR-41) so it reads as a JUMP GATE, distinct from the hub's StationHull. Placed away
# from the hub/spawn so reaching it requires navigating.
- id: jump-gate
  type: JumpGate
  name: Portão de Salto
  pos:
    x: 1600
    y: 2300
  dockRange: 280
  components:
    - type: GatePortal
      size:
        w: 200
        h: 200
      spin: 0.16
      palette:
        ring: '#2e2a4a'
        glow: '#b48dff'
