# --- Legacy sprite-based asteroid. Kept for reference; no longer referenced by any phase.
#     Superseded by the procedural asteroid-metal / -energy / -crystal below.
- id: asteroid-a
  type: Asteroid
  # Passive obstacle: not picked up by radar, droid auto-fire or smart-missile targeting.
  detectable: false
  collidable:
    health: 10
    damage: 20
  speed:
    down: 1.25
  size:
    w: 95
    h: 93
  detonable:
    explosion: explosion-a-3
  components:
    - type: Sprite
      src: enemies/asteroid-a
      size:
        w: 95
        h: 93

# --- Procedural asteroids (pixel-art, seeded per position). Each carries a different ore,
#     signalled by the `accent` speckle color. Passive obstacles: detectable: false.
#     Swap `AsteroidRock` for a `Sprite` once raster art exists — nothing else changes.

# Metal-bearing rock: large, tough, steel-gray speckles.
- id: asteroid-metal
  type: Asteroid
  detectable: false
  collidable:
    health: 14
    damage: 20
  speed:
    down: 0
  size:
    w: 92
    h: 88
  detonable:
    explosion: explosion-a-3
  # Mined by destruction: drops ore into ship cargo (no XP/credits — it's not a kill).
  reward:
    resources:
      metal: 3
  # Timed respawn at the original anchor; subtle "rock" materialisation VFX.
  respawn:
    delay: 15000
    warp: warp-in-rock
  components:
    - type: AsteroidRock
      size:
        w: 92
        h: 88
      palette:
        rock: '#5c5f66'
        accent: '#c2cad6'
      spin:
        min: 0.05
        max: 0.2

