- id: one-f-a-vertical
  type: Ship
  collidable:
    health: 50
    damage: 100
  detonable:
    explosion: explosion-a-2
  pos:
    x: center
    y: bottom
  speed:
    up: 1.5
    left: 2
    right: 2
    down: 1
  physics:
    accel: 0.18
    damping: 0.94
    maxSpeed: 3.5
    turnRate: 0.06
    tiltScale: 1.0
    maxTilt: 0.5
    tiltLerp: 0.08
    bankThreshold: 0.35
  # Discrete dash (ADR-36): a tap opens a 320ms boosted window (accel×3, maxSpeed×2.2), then a
  # 2s cooldown (shortened by Reflexo) before the next. Replaces the old hold-to-boost afterburner.
  dash:
    cooldownMs: 2000
    durationMs: 320
    accelMult: 3.0
    maxSpeedMult: 2.2
  size:
    w: 58.4
    h: 64.5
  sprite:
    row: 2
    col: 1
  acceleration:
    row: 200
    col: 0
  components:
    - type: Spritesheet
      src: characters/one-f-a-vertical
      size:
        w: 58.4
        h: 64.5
      rows: 3
      cols: 3
      acceleration:
        row: 200
        col: 0
      sprite:
        row: 2
        col: 1
    - type: HealthBar
      outer:
        color: white
        pos:
          x: 0
          y: 10
        size:
          w: 2
          h: 7
      inner:
        color: red
        pos:
          x: 1
          y: 9
        size:
          h: 5
  # Weapons (ADR-33): each binding fires on its key with a fire-rate `cooldown` (ms) and maps to a
  # HUD slot. PULSE (Q) is the rapid, unlimited main gun; SEEKER (W) is the homing laser with a
  # limited `ammo` magazine that refills on docking at a hub. E is intentionally free now.
  projectiles:
    - id: bullet
      event: input:q
      slot: pulse
      cooldown: 350
    - id: laser
      event: input:w
      slot: missile
      cooldown: 450
      ammo: 6
  sensors:
    - id: ANv-9q
      type: Radar
    - id: R2D2
      type: Droid
