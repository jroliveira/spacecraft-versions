- id: loading-a
  type: Scenario
  backgroundColor: '#070b14'
  size:
    w: 1920
    h: 1080
  setup:
    images:
      - components/loading-a
  components:
    - type: Loading
      src: components/loading-a
      size:
        w: 2500
        h: 100
      pos:
        x: center
        y: center
      frame:
        ticks: 10
        total: 25

- id: 1st
  type: Scenario
  backgroundColor: '#070b14'
  size:
    w: 1920
    h: 1080
  phase:
    id: 1st
  components:
    # === Top-left cluster (sector + clock + droid pip — kept as user prefers) ===
    - type: SectorTag
      pos: { x: '24', y: '20' }
      text: SECTOR · BELT-04
      status: ok
      recording: true
    - type: Clock
      pos: { x: '24', y: '46' }
      day: 47
      time: '03:24:18'
      tick: true
    - type: DroidPip
      pos: { x: '24', y: '90' }
      active: true
      mode: ATTACK
      charge: 0.72
      label: DROID

    # === Top-right — CREDITS readout, mirroring the minimap's 16px margin ===
    # Minimap sits at margin m=16 (minimap.ts), so its left edge = 1920 - 240 - 16 = 1664 and its
    # top = 16. Score has a fixed width (200) and right-aligns its content, so x=1448 lands the
    # right edge at 1648 — a 16px gap to the minimap — and y=16 aligns their tops.
    - type: Score
      pos: { x: '1448', y: '16' }
      score: 0

    # === Floating toast (left, under banner) ===
    - type: Toast
      pos: { x: '24', y: '160' }
      mode: stack
      width: 320
      autoDismiss: 6000

    # === Bottom-left log (aligned with bottom card cluster) ===
    # Starts EMPTY: the SYS.LOG is fed by real domain events (mining pickups, kill bounty, level
    # up, ship death, respawn) — see EventLog widget. No mock seed entries.
    - type: EventLog
      pos: { x: '24', y: '846' }
      width: 460
      maxRows: 6

    # === Bottom-center cluster (A3 layout: HP card · Radar · Armaments card) ===
    # Reference: docs/design/.../cockpit-refined.jsx CockpitAtmospheric().
    # The three items sit at bottom:24 with gap:18, total ~746px wide centered.
    # Panels are listed FIRST so they render BEHIND the widgets on top.

    # Bottom-center cluster — geometry (design space 1920×1080), anchored near the screen bottom:
    #   Radar disc (diameter 176, centered x) is the tallest element, its bottom ~16px from the
    #   viewport bottom → center line at y≈976. The two flanking cards share that center line
    #   (centers at 976), so the bigger radar slightly over/under-hangs them — like the reference.
    #   Equal 7px gap to the radar (pilot right edge 865 / radar left 872; armaments left 1055 /
    #   radar right 1048). The RadarHud is now a DOM widget, so it scales with the cards at any size.

    # Card 1 frame — Pilot (Name/HULL/XP). 280×146, corners on. 16px padding left/right/top; the
    # extra 2px height (vs armaments' 144) gives the XP bar a touch more bottom padding so it
    # matches the Name→top gap (the pair need NOT be the same height). Bars 248 wide (280 - 2×16).
    # Center 976 → top = 976 - 73 = 903.
    - type: Panel
      pos: { x: '585', y: '903' }
      width: 280
      height: 146
      cut: md
      corners: true

    # Card 3 frame — Armaments. 280×144, mirrored gap to the radar (left edge 1055). Center 976 → top 904.
    - type: Panel
      pos: { x: '1055', y: '904' }
      width: 280
      height: 144
      label: ARMAMENTS
      cut: md
      corners: true

    # NOTE: radar has NO card wrapper in A3 — it's just the disc.

    # Widgets on top of Card 1 (Pilot) — left/top padding 16 from the panel (585,903).
    # Rows: PilotCard (y919) · HULL (y971) · XP (y1013), 14px gaps, 18px bottom padding.
    - type: PilotCard
      pos: { x: '601', y: '919' }
      name: VANGUARD-07
      sub: 'DRIFTER · ESS. ENG'
      size: 38
    # HULL is live: the Ship emits `player:damaged { hp, max }` on spawn + on damage
    # (health 50 from characters.yaml). These config numbers are placeholders overwritten on mount.
    # width 248 = panel 280 - 2×16 padding; matches the XP bar below it.
    - type: Health
      pos: { x: '601', y: '971' }
      value: 50
      max: 50
      label: HULL
      size: md
      width: 248
    # NOTE: the Shields widget was removed — shields are not a domain concept yet (mocked 4/6).
    # The component code stays; parked in docs/features/ideas/ui/2026-06-05-hud-mock-components-parking.md.
    # Pilot progression — LVL + XP bar. Values are live (AttributeSystem → player:state);
    # the config numbers are placeholders overwritten on mount. width 248 = same as the HULL bar.
    - type: XPBar
      pos: { x: '601', y: '1013' }
      width: 248

    # Radar — standalone disc (DOM widget). diameter 176; the widget canvas adds a 12px MARGIN all
    # around (so the ring stroke + glow aren't clipped) → canvas is 200×200, disc center at canvas
    # 100. To keep the disc center on the cluster line (976): top = 976 - 100 = 876.
    - type: RadarHud
      pos: { x: 'center', y: '876' }
      diameter: 176
      label: RDR-01

    # Widget on top of Card 3 (Armaments) — 248 wide (2 cards × 116 + 16 gap), left pad 16
    # (x1071), bottom pad below the ARMAMENTS label. Center 976 → y948.
    - type: Weapons
      pos: { x: '1071', y: '948' }
      active: pulse
      bulletAmmo: 1
      missileAmmo: 4
      missileMax: 6
      cooldown: 0.15

    # === Bottom-right corner — VEL readout inside small card ===
    # NOTE: FUEL and ALT were removed — neither is a domain concept (mocked). Only VEL is real
    # (live ship telemetry). Parked in docs/features/ideas/ui/2026-06-05-hud-mock-components-parking.md.
    # Narrowed horizontally for just VEL (right-anchored: right edge stays at 1900). Left/top padding
    # 14; the right padding is larger by design (the number grows). Height unchanged.
    - type: Panel
      pos: { x: '1804', y: '1004' }
      width: 96
      height: 52
      cut: sm
      corners: false
    - type: SpeedReadout
      pos: { x: '1818', y: '1018' }
      vel: 240
      velMax: 380

    # === Damage arc overlay (Canvas, reacts to entity:damaged) ===
    - type: DamageArc
      pos: { x: '0', y: '0' }

    # === World minimap with fog of war (flush top-right of the playfield) ===
    - type: Minimap
      pos: { x: right, y: top }
      width: 240
      height: 135
      cellSize: 300
      revealRadius: 1000

    # === Active contract (right rail, under the minimap) ===
    # Live readout of the ContractSystem (ADR-24): title/objective/progress/reward + KILLS count.
    # Descriptor is mock-free — fed by `contract:state` (the config values are placeholders the
    # first `contract:state` overwrites). Right edge aligned to the minimap (1904): x = 1904 - 280.
    # Minimap bottom = 16 + 135 = 151; +17 gap → y 168.
    - type: Contract
      pos: { x: '1624', y: '168' }
      width: 280
      expanded: true

    # === Dock prompt (bottom-center, under the ship) ===
    # Hidden until the ship enters a hub's dockRange (hub:dock-available); "[F] ATRACAR · <hub>".
    - type: DockPrompt
      pos: { x: center, y: bottom }
  setup:
    images:
      - backgrounds/1st-parallax-a
      - backgrounds/1st-parallax-b
      - backgrounds/1st-starfield-a-vertical
      - characters/one-f-a-vertical
      - controls/cursor-a
      - controls/joystick-a
      - enemies/asteroid-a
      - explosions/explosion-a-1
      - explosions/explosion-a-2
      - objects/starbase
      - projectiles/bullet
      - projectiles/missile-vertical
    entities:
      - id: explosion-a-1.1
        resource: explosions
      - id: explosion-a-2
        resource: explosions
      - id: explosion-a-3
        resource: explosions

