# Contract templates (seed). Loaded into the `contracts` store by setup() each boot.
# The mutable progress/status lives in the separate `contract-save` store.
#
# ADR-24 (foundation) + ADR-25 (bulletin board): a POOL of hunt contracts. None is
# auto-accepted — the player opens the Bulletin Board (key `B` / clicking the Contract
# widget) and accepts one, which becomes the single active contract. Accepting another
# abandons the previous (progress resets); completing one removes it from the board for
# good (the `contract-save.completedIds` latch) and never re-pays.
#
# `objective.kind: kill` counts `entity:destroyed` whose entity `type` is in `targets`
# (asteroids/projectiles/the player ship also fire that event — only these types count).
# `reward` is a bonus on top of the per-kill bounty the pirates already grant.
- id: clear-the-belt
  title: Clear the Belt
  client: KESSEN STATION · SECURITY
  summary: Destroy pirate craft menacing the Belt-04 mining lanes.
  objective:
    kind: kill
    targets:
      - Drone
      - Fighter
    count: 8
  reward:
    credits: 300
    xp: 120
  danger: med

